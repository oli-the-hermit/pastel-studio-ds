[package]
name = "pastel-studio-canvas"
version = "0.1.0"
description = "Pastel Studio Canvas, a mockup editor on the Pastel Studio design system"
authors = ["San Milano"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
