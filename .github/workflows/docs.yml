# Publishes the documentation site to GitHub Pages on every push to main:
# https://oli-the-hermit.github.io/pastel-studio-ds/
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the docs for the repository's sub-path
        run: npm run docs:build
        env:
          DOCS_BASE: /pastel-studio-ds/

      # The docs route in the browser, so a link straight to a page must load the app:
      # Pages serves 404.html for any path it has no file for.
      - name: Serve the app for every page
        run: cp apps/docs/dist/index.html apps/docs/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
